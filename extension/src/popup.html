<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WeCode Connect</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px 0;
    }

    .version {
      font-size: 11px;
      color: #64748b;
      margin: 0 0 16px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #f8fafc;
      color: #0f172a;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
    }

    .indicator.success {
      background: #4ade80;
    }

    .indicator.error {
      background: #f87171;
    }

    .status.success {
      color: #4ade80;
    }

    .status.error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <h1>WeCode</h1>
  <p class="version" id="version"></p>

  <button id="syncButton" type="button">Sync</button>

  <div class="status" id="status">
    <span class="indicator" id="indicator"></span>
    <span id="statusText">Checking…</span>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
